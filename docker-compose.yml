services:
  postgres:
    image: postgres:16-alpine
    container_name: webscrapping-farmacias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webscrapping_farmacias}
      POSTGRES_USER: ${POSTGRES_USER:-webscrapping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webscrapping_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
