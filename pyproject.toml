[project]
name = "webscrapping-farmacias"
version = "0.1.0"
description = "API e ferramenta de Web Scraping de Preços para redes de Farmácias brasileiras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "rich>=13.8.0",
    "python-multipart>=0.0.9",
    "curl_cffi>=0.7.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
